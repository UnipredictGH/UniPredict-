const H={apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`,“Content-Type”:“application/json”};
const db=t=>`${SUPA_URL}/rest/v1/${t}`;
async function sq(t,p=””){try{const r=await fetch(db(t)+p,{headers:H});return r.json();}catch{return[];}}
async function ins(t,b){try{const r=await fetch(db(t),{method:“POST”,headers:{…H,Prefer:“return=representation”},body:JSON.stringify(b)});return r.json();}catch{return null;}}
async function upd(t,id,b){try{const r=await fetch(`${db(t)}?id=eq.${id}`,{method:“PATCH”,headers:{…H,Prefer:“return=representation”},body:JSON.stringify(b)});return r.json();}catch{return null;}}
async function del(t,id){try{await fetch(`${db(t)}?id=eq.${id}`,{method:“DELETE”,headers:H});}catch{}}
async function upsert(t,key,val){const ex=await sq(t,`?key=eq.${key}&select=id`);if(ex?.[0]?.id)return upd(t,ex[0].id,{value:val,updated_at:new Date().toISOString()});return ins(t,[{key,value:val}]);}
const ago=ts=>{if(!ts)return”—”;const d=Math.floor((Date.now()-new Date(ts))/1000);if(d<60)return`${d}s ago`;if(d<3600)return`${Math.floor(d/60)}m ago`;if(d<86400)return`${Math.floor(d/3600)}h ago`;return`${Math.floor(d/86400)}d ago`;};

if(row.key===“pricing”)setPricing(v=>({…v,…(row.value||{})}));
if(row.key===“payment_keys”)setPaystack(row.value||{});
if(row.key===“legal”)setLegal(v=>({…v,…(row.value||{})}));
if(row.key===“knust_logic”)setKnust(row.value||knust);
if(row.key===“tracks”)setTracks(row.value||{});
});
});
},[]);
const save=async(key,val)=>{setSaving(true);await upsert(“settings”,key,val);setSaving(false);toast(`${key} saved`);};
const TABS=[{id:“pricing”,label:“💰 Pricing”},{id:“payment”,label:“🔑 Paystack”},{id:“legal”,label:“📄 Legal Pages”},{id:“knust”,label:“🎓 KNUST/UMaT”},{id:“tracks”,label:“📚 Track Electives”}];
const lbl={fontSize:12,fontWeight:600,color:”#374151”,display:“block”,marginBottom:4};
return h(“div”,{style:css.page},
h(“div”,{style:{…css.title,marginBottom:16}},“Settings”),
h(“div”,{style:{display:“flex”,gap:0,marginBottom:20,borderBottom:“2px solid #e5e7eb”,overflowX:“auto”}},
TABS.map(t=>h(“button”,{key:t.id,onClick:()=>setTab(t.id),style:{padding:“8px 16px”,fontSize:12,fontWeight:600,background:“none”,border:“none”,cursor:“pointer”,borderBottom:tab===t.id?“2px solid #7c3aed”:“2px solid transparent”,color:tab===t.id?”#7c3aed”:”#9ca3af”,whiteSpace:“nowrap”,marginBottom:-2}},t.label))
),
tab===“pricing”&&h(“div”,{style:{maxWidth:400,display:“flex”,flexDirection:“column”,gap:12}},
h(Card,{style:{padding:20}},
h(“div”,{style:{fontWeight:700,fontSize:14,marginBottom:12}},“Plan Prices (GHC)”),
[[“price_basic”,“Basic (1 University)”],[“price_premium”,“Premium (All Universities)”],[“price_bundle”,“Bundle (3 Checks)”]].map(([k,l])=>h(“div”,{key:k,style:{marginBottom:12}},h(“label”,{style:lbl},l),inp(pricing[k],v=>setPricing(p=>({…p,[k]:parseInt(v)||0})),””,“number”))),
btn(“💾 Save Prices”,()=>save(“pricing”,pricing),“primary”,{full:true,disabled:saving})
),
h(Card,{style:{padding:12,background:”#fffbeb”,border:“1px solid #fcd34d”}},
h(“div”,{style:{fontSize:12,fontWeight:700,color:”#92400e”,marginBottom:4}},“⚠️ Fallback Prices”),
h(“div”,{style:{fontSize:12,color:”#92400e”}},“After saving here, also update the PRICES constant in the student app (GHC12/18/25) to keep fallbacks in sync.”)
)
),
tab===“payment”&&h(“div”,{style:{maxWidth:400}},
h(Card,{style:{padding:20,display:“flex”,flexDirection:“column”,gap:12}},
h(“div”,{style:{fontWeight:700,fontSize:14}},“Paystack API Keys”),
h(“div”,{style:{fontSize:12,color:”#9ca3af”}},“Only the public key is sent to the student app.”),
h(“div”,null,h(“label”,{style:lbl},“Public Key (pk_…)”),inp(paystack.public_key||””,v=>setPaystack(p=>({…p,public_key:v})),“pk_live_…”)),
h(“div”,null,h(“label”,{style:lbl},“Secret Key (sk_…)”),inp(paystack.secret_key||””,v=>setPaystack(p=>({…p,secret_key:v})),“sk_live_…”,“password”)),
btn(“💾 Save Keys”,()=>save(“payment_keys”,{paystack:paystack.public_key,secret:paystack.secret_key}),“primary”,{full:true,disabled:saving})
)
),
tab===“legal”&&h(“div”,{style:{maxWidth:640,display:“flex”,flexDirection:“column”,gap:12}},
h(“div”,{style:{fontSize:12,color:”#9ca3af”}},“Write the full text for each legal page. Overrides the hardcoded fallback in the student app.”),
[[“privacy”,“Privacy Policy”],[“terms”,“Terms of Service”],[“disclaimer”,“Disclaimer”],[“refund”,“Refund Policy”]].map(([k,l])=>h(Card,{key:k,style:{padding:16}},
h(“div”,{style:{display:“flex”,alignItems:“center”,justifyContent:“space-between”,marginBottom:8}},h(“span”,{style:{fontWeight:700,fontSize:14}},l),btn(“Save”,()=>save(“legal”,{…legal,[k]:legal[k]}),“primary”,{sm:true,disabled:saving})),
textarea(legal[k]||””,v=>setLegal(l2=>({…l2,[k]:v})),`Enter full ${l} text…`,6)
)),
btn(“💾 Save All Legal Pages”,()=>save(“legal”,legal),“primary”,{full:true,lg:true,disabled:saving})
),
tab===“knust”&&h(“div”,{style:{maxWidth:500,display:“flex”,flexDirection:“column”,gap:12}},
h(Card,{style:{padding:20}},
h(“div”,{style:{fontWeight:700,fontSize:14,marginBottom:4}},“Universities Excluding Social Studies”),
h(“div”,{style:{fontSize:12,color:”#9ca3af”,marginBottom:12}},“Social Studies is never counted for these universities. Only Integrated Science is used.”),
inp((knust.excl_soc_unis||[]).join(”, “),v=>setKnust(k=>({…k,excl_soc_unis:v.split(”,”).map(x=>x.trim()).filter(Boolean)})),“KNUST, UMAT”)
),
h(Card,{style:{padding:20}},
h(“div”,{style:{fontWeight:700,fontSize:14,marginBottom:4}},“KNUST Social Studies Exception Programmes”),
h(“div”,{style:{fontSize:12,color:”#9ca3af”,marginBottom:12}},“For these KNUST programmes only, Social Studies replaces Integrated Science.”),
inp((knust.soc_exceptions||[]).join(”, “),v=>setKnust(k=>({…k,soc_exceptions:v.split(”,”).map(x=>x.trim().toLowerCase()).filter(Boolean)})),“political science, publishing studies, law”)
),
h(Card,{style:{padding:20}},
h(“div”,{style:{fontWeight:700,fontSize:14,marginBottom:4}},“KNUST Nursing / Midwifery Track”),
h(“div”,{style:{fontSize:12,color:”#9ca3af”,marginBottom:12}},“Only this track can apply for KNUST Nursing and Midwifery.”),
inp(knust.nursing_track||“General Science”,v=>setKnust(k=>({…k,nursing_track:v})),“General Science”)
),
btn(“💾 Save KNUST Logic”,()=>save(“knust_logic”,knust),“primary”,{full:true,lg:true,disabled:saving})
),
tab===“tracks”&&h(“div”,{style:{maxWidth:640,display:“flex”,flexDirection:“column”,gap:12}},
h(“div”,{style:{fontSize:12,color:”#9ca3af”}},“Edit elective subjects per track. Separate with commas.”),
TRACKS.map(t=>h(Card,{key:t,style:{padding:16}},
h(“div”,{style:{fontWeight:700,fontSize:14,marginBottom:8}},t),
textarea(((tracks[t]||{}).e||[]).join(”, “),v=>setTracks(tr=>({…tr,[t]:{…(tr[t]||{}),e:v.split(”,”).map(x=>x.trim()).filter(Boolean)}})),“Subject 1, Subject 2…”,2)
)),
btn(“💾 Save Track Electives”,()=>save(“tracks”,tracks),“primary”,{full:true,lg:true,disabled:saving})
)
);
}

/* ── ROOT APP ────────────────────────────────────────────── */
function AdminApp(){
const[page,setPage]=useState(“dashboard”);
const[collapsed,setCollapsed]=useState(false);
const[toastMsg,setToastMsg]=useState(null);
const toast=msg=>setToastMsg(msg);

const pages={
dashboard:h(Dashboard,{toast}),students:h(Students),results:h(StudentResults),payments:h(Payments),
refunds:h(Refunds,{toast}),universities:h(Universities,{toast}),programmes:h(Programmes,{toast}),
cutoffs:h(CutoffManager,{toast}),import:h(ProgrammeImport,{toast}),scholarships:h(Scholarships,{toast}),
forms:h(AdmissionForms,{toast}),news:h(News,{toast}),ticker:h(Notifications,{toast}),
aiinbox:h(AIInbox,{toast}),sms:h(SMSBroadcast,{toast}),analytics:h(Analytics),
visitors:h(Visitors),audit:h(AuditLog),settings:h(Settings,{toast}),
};

return h(“div”,{style:{display:“flex”,minHeight:“100vh”,background:”#f9fafb”}},
h(Sidebar,{page,setPage,collapsed,setCollapsed}),
h(“main”,{style:{flex:1,overflowY:“auto”,minWidth:0}},pages[page]||pages.dashboard),
toastMsg&&h(Toast,{msg:toastMsg,onClose:()=>setToastMsg(null)})
);
}

ReactDOM.createRoot(document.getElementById(“root”)).render(h(AdminApp));
</script>
