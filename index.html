<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UniPredict Admin</title>
<style>
body{background:#0f0f1a;color:#fff;font-family:sans-serif;margin:0;}
.top{background:#161625;padding:14px 20px;border-bottom:2px solid #7C3AED;}
.top h1{margin:0;font-size:16px;color:#a78bfa;}
.tabs{background:#161625;display:flex;overflow-x:auto;padding:0 10px;}
.tab{padding:12px 14px;font-size:13px;font-weight:600;color:#64748b;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;}
.tab.on{color:#a78bfa;border-bottom-color:#7C3AED;}
#main{padding:20px;}
</style>
</head>
<body>
<div class="top"><h1>UniPredict Admin</h1></div>
<div class="tabs" id="tabs"></div>
<div id="main">Loading...</div>
<script>
var CUR = "dash";
var TABS = [
  {id:"dash", label:"Dashboard"},
  {id:"unis", label:"Universities"},
  {id:"progs", label:"Programmes"}
];

function buildTabs() {
var el = document.getElementById(“tabs”);
el.innerHTML = “”;
for (var i = 0; i < TABS.length; i++) {
var t = TABS[i];
var b = document.createElement(“button”);
b.className = “tab” + (CUR === t.id ? “ on” : “”);
b.textContent = t.label;
b.onclick = function(id) { return function() { CUR = id; buildTabs(); document.getElementById(“main”).textContent = “You clicked: “ + id; }; }(t.id);
el.appendChild(b);
}
}

buildTabs();
document.getElementById(“main”).textContent = “Tabs loaded OK. Click a tab.”;
</script>

</body>
</html>
