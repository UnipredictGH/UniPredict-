<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UniPredict Ghana — Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#f9fafb;color:#111827;font-size:13px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:13px;outline:none;border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;width:100%;background:#fff;box-sizing:border-box}
input:focus,select:focus,textarea:focus{border-color:#7c3aed}
table{width:100%;border-collapse:collapse}
th{padding:10px 12px;text-align:left;font-weight:700;font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;background:#f9fafb;border-bottom:1px solid #e5e7eb}
td{padding:10px 12px;font-size:12px;border-bottom:1px solid #f9fafb;color:#374151}
tr:hover td{background:#fafafa}
.card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:640px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb}
.modal-body{padding:20px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-gray{background:#f3f4f6;color:#6b7280}
.badge-green{background:#dcfce7;color:#15803d}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-violet{background:#ede9fe;color:#6d28d9}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:#7c3aed;color:#fff}
.btn-primary:hover:not(:disabled){background:#6d28d9}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-ghost{background:#fff;color:#374151;border:1px solid #d1d5db}
.btn-ghost:hover:not(:disabled){background:#f9fafb}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover:not(:disabled){background:#059669}
.btn-amber{background:#f59e0b;color:#fff}
.btn-amber:hover:not(:disabled){background:#d97706}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-lg{padding:10px 20px;font-size:13px;width:100%;justify-content:center}
.btn-full{width:100%;justify-content:center}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flex{display:flex;align-items:center}
.gap4{gap:4px}
.gap8{gap:8px}
.gap12{gap:12px}
.flex-1{flex:1}
.toast{position:fixed;bottom:16px;right:16px;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;gap:8px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#sidebar{width:200px;flex-shrink:0;background:#111827;display:flex;flex-direction:column;min-height:100vh;transition:width .2s;position:sticky;top:0;height:100vh;overflow-y:auto}
#sidebar.collapsed{width:52px}
#sidebar .logo{display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px solid #1f2937}
#sidebar .logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
#sidebar .logo-text{color:#fff;font-weight:900;font-size:13px;line-height:1.3}
#sidebar .logo-sub{color:#6b7280;font-weight:400;font-size:10px}
#sidebar nav{flex:1;padding:8px 0}
#sidebar nav button{display:flex;align-items:center;gap:10px;padding:8px 12px;background:transparent;color:#9ca3af;border:none;border-left:3px solid transparent;font-size:13px;font-weight:500;width:100%;text-align:left;transition:all .15s;white-space:nowrap}
#sidebar nav button:hover{background:#1f2937;color:#fff}
#sidebar nav button.active{background:#7c3aed;color:#fff;border-left-color:#a78bfa}
#sidebar .footer{padding:12px;font-size:10px;color:#374151;border-top:1px solid #1f2937}
#sidebar .toggle-btn{margin-left:auto;background:none;border:none;color:#6b7280;cursor:pointer;font-size:12px;padding:0}
#sidebar.collapsed nav button span.label{display:none}
#sidebar.collapsed .logo-text,.collapsed .footer{display:none}
#main{flex:1;overflow-y:auto;min-width:0}
.page{padding:24px}
.page-title{font-size:20px;font-weight:900;color:#111827;margin-bottom:4px}
.page-sub{font-size:12px;color:#9ca3af;margin-bottom:20px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{padding:16px}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tab-bar{display:flex;border-bottom:2px solid #e5e7eb;margin-bottom:20px;overflow-x:auto}
.tab-bar button{padding:8px 16px;font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;color:#9ca3af;white-space:nowrap;margin-bottom:-2px}
.tab-bar button.active{border-bottom-color:#7c3aed;color:#7c3aed}
.overflow-x{overflow-x:auto}
textarea{resize:vertical}
.empty-state{padding:48px;text-align:center;color:#9ca3af;font-size:14px}
.row-actions{display:flex;gap:4px}
</style>
</head>
<body>

<div id="sidebar">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <div class="logo-text">UniPredict<br><span class="logo-sub">Admin Panel</span></div>
    <button class="toggle-btn" id="toggleBtn">←</button>
  </div>
  <nav id="nav"></nav>
  <div class="footer">© 2025 UniPredict Ghana</div>
</div>

<div id="main"></div>

<script>
/* ── CONFIG ─────────────────────────────────────────────── */
const SUPA_URL="https://urfqevstrwsrtysbllah.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZnFldnN0cndzcnR5c2JsbGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNTQ5OTQsImV4cCI6MjEwMDkzMDk5NH0.9TPgghMQdHjqwRm51dEVHJ6O115FPBoYBfZHO_siTYI";
const H={apikey:SUPA_KEY,Authorization:`Bearer ${SUPA_KEY}`,"Content-Type":"application/json"};
const db=t=>`${SUPA_URL}/rest/v1/${t}`;
async function sq(t,p=""){try{const r=await fetch(db(t)+p,{headers:H});return r.json();}catch{return[];}}
async function ins(t,b){try{const r=await fetch(db(t),{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify(b)});return r.json();}catch{return null;}}
async function upd(t,id,b){try{const r=await fetch(`${db(t)}?id=eq.${id}`,{method:"PATCH",headers:{...H,Prefer:"return=representation"},body:JSON.stringify(b)});return r.json();}catch{return null;}}
async function del(t,id){try{await fetch(`${db(t)}?id=eq.${id}`,{method:"DELETE",headers:H});}catch{}}
async function upsert(t,key,val){const ex=await sq(t,`?key=eq.${key}&select=id`);if(ex?.[0]?.id)return upd(t,ex[0].id,{value:val,updated_at:new Date().toISOString()});return ins(t,[{key,value:val}]);}
const ago=ts=>{if(!ts)return"—";const d=Math.floor((Date.now()-new Date(ts))/1000);if(d<60)return`${d}s ago`;if(d<3600)return`${Math.floor(d/60)}m ago`;if(d<86400)return`${Math.floor(d/3600)}h ago`;return`${Math.floor(d/86400)}d ago`;};
const fmt=n=>(n||0).toLocaleString();
const fmtGhc=p=>`GHC ${((p||0)/100).toFixed(2)}`;
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const TRACKS=["General Science","General Arts","Business","Home Economics","Visual Arts","Technical","Agricultural Science"];

/* ── HELPERS ─────────────────────────────────────────────── */
function badge(text,color="gray"){return`<span class="badge badge-${color}">${esc(text)}</span>`;}
function btn(label,cls,extra=""){return`<button class="btn btn-${cls}" ${extra}>${label}</button>`;}

function toast(msg){
  const t=document.createElement("div");
  t.className="toast";t.innerHTML=`✓ ${esc(msg)}`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function modal(titleStr,bodyHtml,wide=false){
  const m=document.createElement("div");
  m.className="modal-bg";
  m.innerHTML=`<div class="modal${wide?" wide":""}">
    <div class="modal-head"><span style="font-weight:700;font-size:15px">${esc(titleStr)}</span><button onclick="this.closest('.modal-bg').remove()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#9ca3af">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  m.addEventListener("click",e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
  return m;
}

/* ── NAV ─────────────────────────────────────────────────── */
const NAV=[
  {id:"dashboard",icon:"📊",label:"Dashboard"},
  {id:"students",icon:"👥",label:"Students"},
  {id:"results",icon:"🎯",label:"Student Results"},
  {id:"payments",icon:"💳",label:"Payments"},
  {id:"refunds",icon:"↩️",label:"Refunds"},
  {id:"universities",icon:"🏛️",label:"Universities"},
  {id:"programmes",icon:"📚",label:"Programmes"},
  {id:"cutoffs",icon:"📐",label:"Cut-Off Manager"},
  {id:"import",icon:"📥",label:"Programme Import"},
  {id:"scholarships",icon:"🎓",label:"Scholarships"},
  {id:"forms",icon:"📝",label:"Admission Forms"},
  {id:"news",icon:"📰",label:"News"},
  {id:"ticker",icon:"📣",label:"Notifications"},
  {id:"aiinbox",icon:"🤖",label:"AI Inbox"},
  {id:"sms",icon:"💬",label:"SMS Broadcast"},
  {id:"analytics",icon:"📈",label:"Analytics"},
  {id:"visitors",icon:"👁️",label:"Visitors"},
  {id:"audit",icon:"🔍",label:"Audit Log"},
  {id:"settings",icon:"⚙️",label:"Settings"},
];

const navEl=document.getElementById("nav");
NAV.forEach(n=>{
  const b=document.createElement("button");
  b.dataset.page=n.id;
  b.innerHTML=`<span style="font-size:15px;flex-shrink:0">${n.icon}</span><span class="label">${n.label}</span>`;
  b.onclick=()=>navigate(n.id);
  navEl.appendChild(b);
});

const sidebar=document.getElementById("sidebar");
document.getElementById("toggleBtn").onclick=()=>{
  sidebar.classList.toggle("collapsed");
  document.getElementById("toggleBtn").textContent=sidebar.classList.contains("collapsed")?"→":"←";
};

function setActiveNav(id){
  navEl.querySelectorAll("button").forEach(b=>{b.classList.toggle("active",b.dataset.page===id);});
}

/* ── ROUTER ──────────────────────────────────────────────── */
const main=document.getElementById("main");
function navigate(page){
  setActiveNav(page);
  main.innerHTML=`<div class="page"><div style="color:#9ca3af;padding:40px;text-align:center">Loading…</div></div>`;
  const pages={dashboard,students,results:studentResults,payments,refunds,universities,programmes,cutoffs,import:programmeImport,scholarships,forms:admissionForms,news,ticker:notifications,aiinbox,sms,analytics,visitors,audit,settings};
  (pages[page]||pages.dashboard)();
}

/* ── DASHBOARD ───────────────────────────────────────────── */
async function dashboard(){
  main.innerHTML=`<div class="page">
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Welcome back, Alexander.</div>
    <div class="stat-grid" id="statGrid">
      <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#ede9fe;color:#6d28d9">👥</div><div><div style="font-size:11px;color:#9ca3af">Total Students</div><div id="statStudents" style="font-size:22px;font-weight:900">—</div></div></div></div>
      <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#dcfce7;color:#15803d">💰</div><div><div style="font-size:11px;color:#9ca3af">Total Revenue</div><div id="statRevenue" style="font-size:22px;font-weight:900">—</div></div></div></div>
      <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#fef3c7;color:#92400e">🎯</div><div><div style="font-size:11px;color:#9ca3af">Checks Today</div><div id="statToday" style="font-size:22px;font-weight:900">—</div></div></div></div>
      <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#dbeafe;color:#1d4ed8">💳</div><div><div style="font-size:11px;color:#9ca3af">Paid Checks</div><div id="statPaid" style="font-size:22px;font-weight:900">—</div></div></div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Top SHS Tracks</div><div id="trackChart"></div></div>
      <div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Recent Payments</div><div id="recentPay"></div></div>
    </div>
  </div>`;
  const [pays,checks]=await Promise.all([
    sq("payments","?select=amount,plan,created_at&order=created_at.desc&limit=300"),
    sq("student_checks","?select=track&limit=500")
  ]);
  const today=new Date().toDateString();
  document.getElementById("statStudents").textContent=fmt(checks.length);
  document.getElementById("statRevenue").textContent=fmtGhc(pays.reduce((a,p)=>a+(p.amount||0),0));
  document.getElementById("statToday").textContent=fmt(pays.filter(p=>new Date(p.created_at).toDateString()===today).length);
  document.getElementById("statPaid").textContent=fmt(pays.length);
  const c={};checks.forEach(r=>{if(r.track)c[r.track]=(c[r.track]||0)+1;});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxT=Math.max(...top.map(t=>t[1]),1);
  document.getElementById("trackChart").innerHTML=top.map(([t,n])=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div style="font-size:12px;width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</div>
      <div style="flex:1;background:#f3f4f6;border-radius:99px;height:6px"><div style="width:${(n/maxT)*100}%;background:#7c3aed;height:6px;border-radius:99px"></div></div>
      <div style="font-size:11px;color:#9ca3af;width:20px;text-align:right">${n}</div>
    </div>`).join("")||"<div style='color:#9ca3af;font-size:12px'>No data yet</div>";
  document.getElementById("recentPay").innerHTML=pays.slice(0,6).map(p=>`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="flex gap8">${badge(p.plan,p.plan==="premium"?"violet":p.plan==="bundle"?"amber":"gray")}<span style="font-size:11px;color:#9ca3af">${ago(p.created_at)}</span></div>
      <span style="font-size:12px;font-weight:700">${fmtGhc(p.amount)}</span>
    </div>`).join("")||"<div style='color:#9ca3af;font-size:12px'>No payments yet</div>";
}

/* ── STUDENTS ────────────────────────────────────────────── */
async function students(){
  main.innerHTML=`<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div><div class="page-title">Students</div><div class="page-sub" style="margin:0">Loading…</div></div>
      <button class="btn btn-ghost" id="exportBtn">⬇ Export CSV</button>
    </div>
    <div class="card" style="padding:8px;margin-bottom:12px"><input id="searchInput" placeholder="Search by phone, track, plan…"/></div>
    <div class="card overflow-x" id="tableWrap"><div style="padding:40px;text-align:center;color:#9ca3af">Loading…</div></div>
  </div>`;
  const rows=await sq("student_checks","?order=checked_at.desc&limit=300");
  document.querySelector(".page-sub").textContent=rows.length+" total checks";
  document.getElementById("exportBtn").onclick=()=>{
    const csv=["Phone,Track,Plan,Aggregate,Date",...rows.map(r=>`${r.phone},${r.track},${r.plan},${r.aggregate},${r.checked_at}`)].join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="students.csv";a.click();
  };
  function render(q){
    const f=rows.filter(r=>(r.phone||"").includes(q)||(r.track||"").toLowerCase().includes(q.toLowerCase())||(r.plan||"").includes(q));
    document.getElementById("tableWrap").innerHTML=`<table><thead><tr><th>Phone</th><th>Track</th><th>Plan</th><th>Aggregate</th><th>Electives</th><th>Date</th></tr></thead><tbody>${
      f.map(r=>`<tr><td style="font-weight:600">${esc(r.phone||"—")}</td><td style="color:#6b7280">${esc(r.track||"—")}</td><td>${badge(r.plan,r.plan==="premium"?"violet":r.plan==="bundle"?"amber":"gray")}</td><td style="font-weight:900;color:#7c3aed">${r.aggregate||"—"}</td><td style="color:#9ca3af;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((r.electives||[]).join(", ")||"—")}</td><td style="color:#9ca3af">${ago(r.checked_at)}</td></tr>`).join("")||
      "<tr><td colspan='6' style='text-align:center;color:#9ca3af;padding:32px'>No students found</td></tr>"
    }</tbody></table>`;
  }
  render("");
  document.getElementById("searchInput").oninput=e=>render(e.target.value);
}

/* ── STUDENT RESULTS ─────────────────────────────────────── */
async function studentResults(){
  main.innerHTML=`<div class="page">
    <div class="page-title">Student Results Viewer</div>
    <div class="page-sub">See exactly what every student got when they paid</div>
    <div class="card" style="padding:8px;margin-bottom:12px"><input id="searchInput" placeholder="Search by phone or track…"/></div>
    <div class="card overflow-x" id="tableWrap"><div style="padding:40px;text-align:center;color:#9ca3af">Loading…</div></div>
  </div>`;
  const rows=await sq("student_checks","?order=checked_at.desc&limit=300&select=id,phone,track,plan,aggregate,grades_core,electives,elective_grades,checked_at,payment_ref");
  function render(q){
    const f=rows.filter(r=>(r.phone||"").includes(q)||(r.track||"").toLowerCase().includes(q.toLowerCase()));
    document.getElementById("tableWrap").innerHTML=`<table><thead><tr><th>Phone</th><th>Track</th><th>Plan</th><th>Aggregate</th><th>Date</th><th></th></tr></thead><tbody>${
      f.map((r,i)=>`<tr><td style="font-weight:600">${esc(r.phone)}</td><td style="color:#6b7280">${esc(r.track)}</td><td>${badge(r.plan,r.plan==="premium"?"violet":"gray")}</td><td style="font-weight:900;color:#7c3aed">${r.aggregate||"—"}</td><td style="color:#9ca3af">${ago(r.checked_at)}</td><td><button class="btn btn-primary btn-sm viewBtn" data-i="${i}">View</button></td></tr>`).join("")||
      "<tr><td colspan='6' style='text-align:center;color:#9ca3af;padding:32px'>No students</td></tr>"
    }</tbody></table>`;
    document.querySelectorAll(".viewBtn").forEach(b=>b.onclick=()=>{
      const r=f[+b.dataset.i];
      const gc=r.grades_core||{};const eg=r.elective_grades||{};
      modal(`Results — ${r.phone}`,`
        <div class="grid2" style="margin-bottom:16px">
          ${[["Track",r.track],["Plan",r.plan],["Aggregate",r.aggregate],["Ref",(r.payment_ref||"").slice(0,16)],["English",gc.eng],["Maths",gc.maths],["Science",gc.sci],["Social Studies",gc.soc]].map(([k,v])=>`
            <div style="background:#f9fafb;border-radius:8px;padding:10px"><div style="font-size:10px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-bottom:2px">${k}</div><div style="font-size:14px;font-weight:700">${esc(v||"—")}</div></div>`).join("")}
        </div>
        <div style="background:#ede9fe;border-radius:12px;padding:12px">
          <div style="font-size:10px;color:#7c3aed;font-weight:700;text-transform:uppercase;margin-bottom:8px">Electives & Grades</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">${(r.electives||[]).map(e=>`<span style="background:#fff;border:1px solid #c4b5fd;color:#6d28d9;padding:4px 10px;border-radius:8px;font-size:12px">${esc(e)} — ${esc(eg[e]||"?")}</span>`).join("")}</div>
        </div>`,true);
    });
  }
  render("");
  document.getElementById("searchInput").oninput=e=>render(e.target.value);
}

/* ── PAYMENTS ────────────────────────────────────────────── */
async function payments(){
  main.innerHTML=`<div class="page">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div><div class="page-title">Payments</div><div class="page-sub" style="margin:0" id="payTotal">Loading…</div></div>
      <button class="btn btn-ghost" id="exportBtn">⬇ Export CSV</button>
    </div>
    <div class="card" style="padding:8px;margin-bottom:12px"><input id="searchInput" placeholder="Search…"/></div>
    <div class="card overflow-x" id="tableWrap"><div style="padding:40px;text-align:center;color:#9ca3af">Loading…</div></div>
  </div>`;

</div>
<div style="display:flex;gap:8px">
<button class="btn btn-ghost" id="previewBtn">Preview Recipients</button>
<button class="btn btn-success" id="sendBtn" style="display:none">Send</button>

<div id="previewResult"></div>
</div>

  </div>`;
  let previewPhones=[];
  document.getElementById("filterSel").onchange=()=>{
    const v=document.getElementById("filterSel").value;
    document.getElementById("filterDetail").innerHTML=v==="track"?`<select id="trackSel"><option value="">Select track</option>${TRACKS.map(t=>`<option>${t}</option>`).join("")}</select>`:v==="plan"?`<select id="planSel"><option value="">Select plan</option><option>basic</option><option>premium</option><option>bundle</option></select>`:"";
  };
  document.getElementById("msgText").oninput=e=>{
    const l=e.target.value.length;
    document.getElementById("charCount").textContent=`(${l}/160)`;
    document.getElementById("charWarn").innerHTML=l>160?`<div style="font-size:11px;color:#ef4444;margin-top:4px">Over 160 chars — ${Math.ceil(l/160)} SMS parts</div>`:"";
  };
  document.getElementById("previewBtn").onclick=async()=>{
    const filter=document.getElementById("filterSel").value;
    let q="?select=phone,track,plan";
    if(filter==="track"){const t=document.getElementById("trackSel")?.value;if(t)q+=`&track=eq.${t}`;}
    if(filter==="plan"){const p=document.getElementById("planSel")?.value;if(p)q+=`&plan=eq.${p}`;}
    const d=await sq("student_checks",q+"&limit=500");
    previewPhones=[...new Set((d||[]).map(r=>r.phone).filter(Boolean))];
    document.getElementById("previewResult").innerHTML=`<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:12px"><div style="font-size:12px;font-weight:700;color:#15803d;margin-bottom:4px">${previewPhones.length} recipients found</div><div style="font-size:11px;font-family:monospace;color:#15803d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(previewPhones.slice(0,5).join(", "))}${previewPhones.length>5?` + ${previewPhones.length-5} more`:""}</div></div>`;
    const sendBtn=document.getElementById("sendBtn");sendBtn.style.display="inline-flex";sendBtn.textContent=`Send to ${previewPhones.length} students`;
  };
  document.getElementById("sendBtn").onclick=async()=>{
    const msg=document.getElementById("msgText").value;if(!msg.trim()||!previewPhones.length)return;
    try{await fetch(`${SUPA_URL}/functions/v1/sms-broadcast`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${SUPA_KEY}`},body:JSON.stringify({message:msg,phones:previewPhones})});await ins("sms_broadcasts",[{message:msg,recipients:previewPhones.length,status:"sent",sent_at:new Date().toISOString()}]);toast(`SMS sent to ${previewPhones.length} students`);document.getElementById("msgText").value="";document.getElementById("previewResult").innerHTML="";document.getElementById("sendBtn").style.display="none";}
    catch{toast("SMS failed — check Arkesel config");}
  };
}

/* ── ANALYTICS ───────────────────────────────────────────── */
async function analytics(){
main.innerHTML=`<div class="page">
<div class="page-title" style="margin-bottom:20px">Analytics</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
<div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Checks Per Day (last 14 days)</div><div id="dayChart" style="display:flex;align-items:flex-end;gap:4px;height:100px"></div></div>
<div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Revenue by Plan</div><div id="planChart"></div></div>
<div class="card" style="padding:16px;grid-column:span 2"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Students by SHS Track</div><div id="trackChart"></div></div>
</div>

  </div>`;
  const[pays,checks]=await Promise.all([sq("payments","?select=amount,plan,created_at&order=created_at.asc&limit=1000"),sq("student_checks","?select=track&limit=500")]);
  const byPlan={},byDay={};
  pays.forEach(p=>{byPlan[p.plan]=(byPlan[p.plan]||0)+1;const day=new Date(p.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"});byDay[day]=(byDay[day]||0)+1;});
  const byTrack={};checks.forEach(c=>{if(c.track)byTrack[c.track]=(byTrack[c.track]||0)+1;});
  const days=Object.entries(byDay).slice(-14);
  const maxDay=Math.max(...days.map(d=>d[1]),1);
  document.getElementById("dayChart").innerHTML=days.map(([day,count])=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">
      <div style="font-size:9px;color:#9ca3af;font-weight:700">${count}</div>
      <div style="width:100%;background:#7c3aed;border-radius:3px 3px 0 0" style="height:${Math.max(4,(count/maxDay)*80)}px"></div>
      <div style="font-size:8px;color:#9ca3af;overflow:hidden;width:100%;text-align:center;text-overflow:ellipsis;white-space:nowrap">${day}</div>
    </div>`).join("")||`<div style="color:#9ca3af;font-size:12px;margin:auto">No data yet</div>`;

// Fix the bar heights via JS since inline style in template literals doesn’t work for dynamic height
const bars=document.getElementById(“dayChart”).querySelectorAll(“div > div:nth-child(2)”);
days.forEach(([,count],i)=>{if(bars[i])bars[i].style.height=Math.max(4,(count/maxDay)*80)+“px”;});

const maxPlan=Math.max(…Object.values(byPlan),1);
document.getElementById(“planChart”).innerHTML=Object.entries(byPlan).map(([plan,count])=>` <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"> <span class="badge badge-${plan==="premium"?"violet":plan==="bundle"?"amber":"gray"}">${plan}</span> <div style="flex:1;background:#f3f4f6;border-radius:99px;height:8px"><div style="width:${(count/maxPlan)*100}%;background:#7c3aed;height:8px;border-radius:99px"></div></div> <span style="font-size:12px;font-weight:700">${count}</span> </div>`).join(””)||`<div style="color:#9ca3af;font-size:12px">No data yet</div>`;
const maxTrack=Math.max(…Object.values(byTrack),1);
document.getElementById(“trackChart”).innerHTML=Object.entries(byTrack).sort((a,b)=>b[1]-a[1]).map(([t,c])=>` <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"> <div style="font-size:12px;width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t)}</div> <div style="flex:1;background:#f3f4f6;border-radius:99px;height:6px"><div style="width:${(c/maxTrack)*100}%;background:#10b981;height:6px;border-radius:99px"></div></div> <span style="font-size:11px;color:#9ca3af">${c}</span> </div>`).join(””);
}

/* ── VISITORS ────────────────────────────────────────────── */
async function visitors(){
main.innerHTML=`<div class="page">
<div class="page-title" style="margin-bottom:16px">Visitor Tracking</div>
<div class="stat-grid" id="vStats" style="margin-bottom:20px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Top Pages</div><div id="topPages"></div></div>
<div class="card" style="padding:16px"><div style="font-weight:700;font-size:13px;margin-bottom:12px">Recent Visits</div><div id="recentVisits"></div></div>
</div>

  </div>`;
  const rows=await sq("visitors","?order=created_at.desc&limit=300");
  const byPage={};rows.forEach(r=>{if(r.page)byPage[r.page]=(byPage[r.page]||0)+1;});
  const today=rows.filter(r=>new Date(r.created_at).toDateString()===new Date().toDateString()).length;
  document.getElementById("vStats").innerHTML=`
    <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#ede9fe;color:#6d28d9">👁️</div><div><div style="font-size:11px;color:#9ca3af">Total Visits</div><div style="font-size:22px;font-weight:900">${fmt(rows.length)}</div></div></div></div>
    <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#dbeafe;color:#1d4ed8">📄</div><div><div style="font-size:11px;color:#9ca3af">Unique Pages</div><div style="font-size:22px;font-weight:900">${fmt(Object.keys(byPage).length)}</div></div></div></div>
    <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#fef3c7;color:#92400e">📱</div><div><div style="font-size:11px;color:#9ca3af">Today</div><div style="font-size:22px;font-weight:900">${fmt(today)}</div></div></div></div>
    <div class="card stat-card"><div class="flex gap8"><div class="stat-icon" style="background:#dcfce7;color:#15803d">🔗</div><div><div style="font-size:11px;color:#9ca3af">With Referrer</div><div style="font-size:22px;font-weight:900">${fmt(rows.filter(r=>r.referrer).length)}</div></div></div></div>`;
  document.getElementById("topPages").innerHTML=Object.entries(byPage).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([page,count])=>`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:12px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(page||"/")}</div>
      ${badge(count,"violet")}
    </div>`).join("")||`<div style="color:#9ca3af;font-size:12px">No visits yet</div>`;
  document.getElementById("recentVisits").innerHTML=rows.slice(0,12).map(r=>`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div><div style="font-size:12px;font-family:monospace">${esc(r.page||"/")}</div><div style="font-size:10px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${esc(r.referrer||"Direct")}</div></div>
      <div style="font-size:10px;color:#9ca3af">${ago(r.created_at)}</div>
    </div>`).join("");
}

/* ── AUDIT LOG ───────────────────────────────────────────── */
async function audit(){
main.innerHTML=`<div class="page">
<div class="page-title" style="margin-bottom:16px">Audit Log</div>
<div class="card overflow-x" id="tableWrap"><div style="padding:40px;text-align:center;color:#9ca3af">Loading…</div></div>

  </div>`;
  const rows=await sq("audit_log","?order=created_at.desc&limit=200");
  document.getElementById("tableWrap").innerHTML=`<table><thead><tr><th>Action</th><th>Table</th><th>Record</th><th>Change</th><th>Time</th></tr></thead><tbody>${
    rows.map(r=>`<tr>
      <td>${badge(r.action,r.action==="INSERT"?"green":r.action==="DELETE"?"red":"amber")}</td>
      <td style="font-family:monospace">${esc(r.table_name)}</td>
      <td style="font-family:monospace;font-size:10px;color:#9ca3af">${esc((r.record_id||"").slice(0,8))}…</td>
      <td style="font-family:monospace;font-size:10px;color:#9ca3af;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(r.new_value||r.old_value||{}))}</td>
      <td style="color:#9ca3af;white-space:nowrap">${ago(r.created_at)}</td>
    </tr>`).join("")||
    "<tr><td colspan='5' style='text-align:center;color:#9ca3af;padding:32px'>No audit entries yet. Run supabase_setup.sql to enable triggers.</td></tr>"
  }</tbody></table>`;
}

/* ── SETTINGS ────────────────────────────────────────────── */
async function settings(){
main.innerHTML=`<div class="page">
<div class="page-title" style="margin-bottom:16px">Settings</div>
<div class="tab-bar">
<button class="active" data-tab="pricing">💰 Pricing</button>
<button data-tab="payment">🔑 Paystack</button>
<button data-tab="legal">📄 Legal Pages</button>
<button data-tab="knust">🎓 KNUST/UMaT</button>
<button data-tab="tracks">📚 Track Electives</button>
</div>
<div id="tabContent"></div>

  </div>`;

const settingsData={};
const raw=await sq(“settings”,”?select=key,value”);
raw.forEach(r=>{settingsData[r.key]=r.value;});
const pricing={price_basic:12,price_premium:18,price_bundle:25,…(settingsData.pricing||{})};
const paystack={public_key:””,secret_key:””,…(settingsData.payment_keys||{})};
const legal={privacy:””,terms:””,disclaimer:””,refund:””,…(settingsData.legal||{})};
const knust={excl_soc_unis:[“KNUST”,“UMAT”],soc_exceptions:[“political science”,“publishing studies”,“law”],nursing_track:“General Science”,…(settingsData.knust_logic||{})};
const tracks=settingsData.tracks||{};

const tabs={“pricing”:` <div style="max-width:400px"> <div class="card" style="padding:20px;margin-bottom:12px"> <div style="font-weight:700;font-size:14px;margin-bottom:12px">Plan Prices (GHC)</div> <div class="form-group"><label>Basic (1 University)</label><input type="number" id="pBasic" value="${pricing.price_basic}"/></div> <div class="form-group"><label>Premium (All Universities)</label><input type="number" id="pPremium" value="${pricing.price_premium}"/></div> <div class="form-group"><label>Bundle (3 Checks)</label><input type="number" id="pBundle" value="${pricing.price_bundle}"/></div> <button class="btn btn-primary btn-full" id="savePricing">💾 Save Prices</button> </div> <div class="card" style="padding:12px;background:#fffbeb;border:1px solid #fcd34d"> <div style="font-size:12px;font-weight:700;color:#92400e;margin-bottom:4px">⚠️ Fallback Prices</div> <div style="font-size:12px;color:#92400e">After saving here, also update the PRICES constant in the student app (GHC12/18/25) to keep fallbacks in sync when Supabase is unavailable.</div> </div> </div>`,
“payment”:` <div style="max-width:400px"> <div class="card" style="padding:20px"> <div style="font-weight:700;font-size:14px;margin-bottom:4px">Paystack API Keys</div> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Only the public key is sent to the student app.</div> <div class="form-group"><label>Public Key (pk_…)</label><input id="pkPublic" value="${esc(paystack.public_key||"")}" placeholder="pk_live_…"/></div> <div class="form-group"><label>Secret Key (sk_…)</label><input type="password" id="pkSecret" value="${esc(paystack.secret_key||"")}" placeholder="sk_live_…"/></div> <button class="btn btn-primary btn-full" id="savePaystack">💾 Save Keys</button> </div> </div>`,
“legal”:` <div style="max-width:640px"> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Write the full text for each legal page. Overrides the hardcoded fallback in the student app.</div> ${[["privacy","Privacy Policy"],["terms","Terms of Service"],["disclaimer","Disclaimer"],["refund","Refund Policy"]].map(([k,l])=>`
<div class="card" style="padding:16px;margin-bottom:8px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
<span style="font-weight:700;font-size:14px">${l}</span>
<button class="btn btn-primary btn-sm saveLegal" data-key="${k}">Save</button>
</div>
<textarea id="legal_${k}" rows="6">${esc(legal[k]||””)}</textarea>
</div>`).join("")} <button class="btn btn-primary btn-lg" id="saveAllLegal" style="margin-top:8px">💾 Save All Legal Pages</button> </div>`,
“knust”:` <div style="max-width:500px"> <div class="card" style="padding:20px;margin-bottom:12px"> <div style="font-weight:700;font-size:14px;margin-bottom:4px">Universities Excluding Social Studies</div> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Social Studies is never counted for these universities. Only Integrated Science is used.</div> <input id="kExclUnis" value="${esc((knust.excl_soc_unis||[]).join(", "))}" placeholder="KNUST, UMAT"/> </div> <div class="card" style="padding:20px;margin-bottom:12px"> <div style="font-weight:700;font-size:14px;margin-bottom:4px">KNUST Social Studies Exception Programmes</div> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">For these KNUST programmes only, Social Studies replaces Integrated Science.</div> <input id="kSocExc" value="${esc((knust.soc_exceptions||[]).join(", "))}" placeholder="political science, publishing studies, law"/> </div> <div class="card" style="padding:20px;margin-bottom:12px"> <div style="font-weight:700;font-size:14px;margin-bottom:4px">KNUST Nursing / Midwifery Track</div> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Only this track can apply for KNUST Nursing and Midwifery.</div> <input id="kNursing" value="${esc(knust.nursing_track||"General Science")}"/> </div> <button class="btn btn-primary btn-lg" id="saveKnust">💾 Save KNUST Logic</button> </div>`,
“tracks”:` <div style="max-width:640px"> <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Edit elective subjects per track. Separate with commas.</div> ${TRACKS.map(t=>`<div class="card" style="padding:16px;margin-bottom:8px"><div style="font-weight:700;font-size:14px;margin-bottom:8px">${t}</div><textarea class="trackInput" data-track="${t}" rows="2">${esc(((tracks[t]||{}).e||[]).join(”, “))}</textarea></div>`).join("")} <button class="btn btn-primary btn-lg" id="saveTracks" style="margin-top:8px">💾 Save Track Electives</button> </div>`};

function showTab(id){
document.querySelectorAll(”.tab-bar button”).forEach(b=>b.classList.toggle(“active”,b.dataset.tab===id));
document.getElementById(“tabContent”).innerHTML=tabs[id];
if(id===“pricing”){
document.getElementById(“savePricing”).onclick=async()=>{await upsert(“settings”,“pricing”,{price_basic:parseInt(document.getElementById(“pBasic”).value),price_premium:parseInt(document.getElementById(“pPremium”).value),price_bundle:parseInt(document.getElementById(“pBundle”).value)});toast(“Prices saved”);};
}
if(id===“payment”){
document.getElementById(“savePaystack”).onclick=async()=>{await upsert(“settings”,“payment_keys”,{paystack:document.getElementById(“pkPublic”).value,secret:document.getElementById(“pkSecret”).value});toast(“Keys saved”);};
}
if(id===“legal”){
document.querySelectorAll(”.saveLegal”).forEach(b=>b.onclick=async()=>{const k=b.dataset.key;const val={…legal,[k]:document.getElementById(`legal_${k}`).value};await upsert(“settings”,“legal”,val);toast(`${k} saved`);});
document.getElementById(“saveAllLegal”).onclick=async()=>{const val={privacy:document.getElementById(“legal_privacy”).value,terms:document.getElementById(“legal_terms”).value,disclaimer:document.getElementById(“legal_disclaimer”).value,refund:document.getElementById(“legal_refund”).value};await upsert(“settings”,“legal”,val);toast(“All legal pages saved”);};
}
if(id===“knust”){
document.getElementById(“saveKnust”).onclick=async()=>{const val={excl_soc_unis:document.getElementById(“kExclUnis”).value.split(”,”).map(x=>x.trim()).filter(Boolean),soc_exceptions:document.getElementById(“kSocExc”).value.split(”,”).map(x=>x.trim().toLowerCase()).filter(Boolean),nursing_track:document.getElementById(“kNursing”).value};await upsert(“settings”,“knust_logic”,val);toast(“KNUST logic saved”);};
}
if(id===“tracks”){
document.getElementById(“saveTracks”).onclick=async()=>{const val={};document.querySelectorAll(”.trackInput”).forEach(inp=>{val[inp.dataset.track]={e:inp.value.split(”,”).map(x=>x.trim()).filter(Boolean)};});await upsert(“settings”,“tracks”,val);toast(“Track electives saved”);};
}
}
document.querySelectorAll(”.tab-bar button”).forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
showTab(“pricing”);
}

/* ── START ───────────────────────────────────────────────── */
navigate(“dashboard”);
</script>

</body>
</html>
